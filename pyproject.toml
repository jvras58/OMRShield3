[project]
name = "omr-autodetect"
version = "1.0.0"
description = "Leitura de cartões-resposta por auto-detecção de bolhas (sem template)"
requires-python = ">=3.11"

dependencies = [
    "opencv-python",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pytesseract",
    "scikit-learn",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[tool.uv]
# Para rodar: uv run python scripts/smoke_test.py data/cartao.jpg
#             uv run uvicorn src.api.app:app --reload --port 8001

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
