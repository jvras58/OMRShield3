[project]
name = "omr-autodetect"
version = "1.0.0"
description = "Leitura de cartões-resposta por auto-detecção de bolhas (sem template)"
requires-python = ">=3.11"

dependencies = [
    "opencv-python",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pytesseract",
    "scikit-learn",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.0",
    "redis>=7.2.1",
    "faststream[cli,redis]>=0.6.6",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "fakeredis", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/worker/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv]
# Para rodar: uv run python scripts/smoke_test.py data/cartao.jpg
#             uv run uvicorn src.api.app:app --reload --port 8001

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
