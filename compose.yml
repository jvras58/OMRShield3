services:
  # ── API FastAPI ───────────────────────────────────────────────────────────────
  api:
    build: .
    image: omrshield
    ports:
      - "8081:8000"
    volumes:
      - ./data:/data
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 4

  # ── Worker FastStream ─────────────────────────────────────────────────────────
  worker:
    build: .
    image: omrshield
    volumes:
      - ./data:/data
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: faststream run src.worker.consumer:app
    # Para escalar horizontalmente: docker compose up --scale worker=4
    deploy:
      replicas: 4

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: